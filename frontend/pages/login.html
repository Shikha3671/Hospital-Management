<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SmartCare</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a href="../index.html" class="logo">SmartCare</a>
        <nav class="nav-links">
          <a href="../index.html">Home</a>
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
          <a href="appointment.html">Appointments</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="form-page">
      <div class="container">
        <div class="form-card">
          <h2>Login</h2>
          <div id="message-box" class="message"></div>
          <form id="login-form">
            <label>Email</label>
            <input id="login-email" type="email" placeholder="Enter your email" required />
            <label>Password</label>
            <input id="login-password" type="password" placeholder="Enter your password" required />
            <button type="submit">Login</button>
          </form>
          <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="register.html">Register</a></p>
        </div>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
