<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Dashboard - SmartCare</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a href="../index.html" class="logo">SmartCare</a>
        <nav class="nav-links">
          <a href="patient-dashboard.html">Dashboard</a>
          <a href="patient-profile.html">Profile</a>
          <a href="appointment.html">Appointments</a>
        </nav>
      </div>
    </header>

    <main class="section container">
      <h2 id="welcome-user">Patient Dashboard</h2>
      <button id="logout-btn" class="btn btn-primary" style="margin-bottom: 1rem;">Logout</button>
      <div id="message-box" class="message"></div>
      <div class="dashboard-grid">
        <div class="panel">
          <h3>Upcoming Appointments</h3>
          <ul class="list">
            <li>Cardiology - July 25, 9:00 AM</li>
            <li>General Checkup - July 30, 2:00 PM</li>
          </ul>
        </div>
        <div class="panel">
          <h3>Medical Summary</h3>
          <ul class="list">
            <li>Blood Pressure: 120/80</li>
            <li>Last Visit: 2 weeks ago</li>
          </ul>
        </div>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
