<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - SmartCare</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a href="../index.html" class="logo">SmartCare</a>
        <nav class="nav-links">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="appointment.html">Appointments</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section container">
      <h2 id="welcome-user">Admin Dashboard</h2>
      <button id="logout-btn" class="btn btn-primary" style="margin-bottom: 1rem;">Logout</button>
      <div id="message-box" class="message"></div>
      <div class="dashboard-grid">
        <div class="panel">
          <h3>Hospital Overview</h3>
          <ul class="list">
            <li>Total Doctors: 12</li>
            <li>Total Patients: 85</li>
            <li>Pending Appointments: 7</li>
          </ul>
        </div>
        <div class="panel">
          <h3>System Actions</h3>
          <ul class="list">
            <li>Manage Departments</li>
            <li>Approve Appointments</li>
            <li>Generate Reports</li>
          </ul>
        </div>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
